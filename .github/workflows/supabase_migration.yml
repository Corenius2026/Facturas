name: Migración Automática Supabase DB

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ejecutar Migraciones en Supabase
        if: ${{ secrets.SUPABASE_PROJECT_ID != '' && secrets.SUPABASE_DB_PASSWORD != '' }}
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} --password ${{ secrets.SUPABASE_DB_PASSWORD }}
          supabase db push --password ${{ secrets.SUPABASE_DB_PASSWORD }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Aviso de Variables Faltantes
        if: ${{ secrets.SUPABASE_PROJECT_ID == '' || secrets.SUPABASE_DB_PASSWORD == '' }}
        run: |
          echo "⚠️ Las variables SUPABASE_PROJECT_ID o SUPABASE_DB_PASSWORD aún no están agregadas en GitHub Secrets."
          echo "Si deseas habilitar migraciones automáticas, agrégalas en GitHub -> Settings -> Secrets and variables -> Actions."
